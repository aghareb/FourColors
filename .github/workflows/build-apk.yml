name: Build FourColors APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'FourColors-AndroidStudio.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip -q FourColors-AndroidStudio.zip
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build APK
        run: cd FourColors && gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FourColors-debug-apk
          path: FourColors/app/build/outputs/apk/debug/app-debug.apk
